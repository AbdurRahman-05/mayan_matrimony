<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#800020" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Sri Mayan Matrimony</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <script>
      window.addEventListener('error', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        errorDiv.style.color = '#ff3333';
        errorDiv.style.padding = '20px';
        errorDiv.style.boxSizing = 'border-box';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.overflow = 'auto';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        
        var title = document.createElement('h1');
        title.innerText = 'Runtime JavaScript Error Caught';
        title.style.fontSize = '20px';
        title.style.margin = '0 0 10px 0';
        title.style.color = '#cc0000';
        errorDiv.appendChild(title);
        
        var message = document.createElement('p');
        message.innerText = 'Error: ' + event.message + '\nSource: ' + event.filename + ':' + event.lineno + ':' + event.colno;
        message.style.margin = '0 0 10px 0';
        errorDiv.appendChild(message);
        
        if (event.error && event.error.stack) {
          var stack = document.createElement('pre');
          stack.innerText = event.error.stack;
          stack.style.whiteSpace = 'pre-wrap';
          stack.style.wordBreak = 'break-all';
          stack.style.background = '#f9f9f9';
          stack.style.padding = '10px';
          stack.style.border = '1px solid #ddd';
          stack.style.borderRadius = '5px';
          errorDiv.appendChild(stack);
        }
        
        document.body.appendChild(errorDiv);
      });
      window.addEventListener('unhandledrejection', function(event) {
        var errorDiv = document.createElement('div');
        errorDiv.style.position = 'fixed';
        errorDiv.style.top = '0';
        errorDiv.style.left = '0';
        errorDiv.style.width = '100%';
        errorDiv.style.height = '100%';
        errorDiv.style.backgroundColor = 'rgba(255, 255, 255, 0.95)';
        errorDiv.style.color = '#ff3333';
        errorDiv.style.padding = '20px';
        errorDiv.style.boxSizing = 'border-box';
        errorDiv.style.zIndex = '999999';
        errorDiv.style.overflow = 'auto';
        errorDiv.style.fontFamily = 'monospace';
        errorDiv.style.fontSize = '14px';
        
        var title = document.createElement('h1');
        title.innerText = 'Unhandled Rejection Caught';
        title.style.fontSize = '20px';
        title.style.margin = '0 0 10px 0';
        title.style.color = '#cc0000';
        errorDiv.appendChild(title);
        
        var reason = document.createElement('p');
        reason.innerText = 'Reason: ' + event.reason;
        reason.style.margin = '0 0 10px 0';
        errorDiv.appendChild(reason);
        
        document.body.appendChild(errorDiv);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
